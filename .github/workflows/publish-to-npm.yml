name: Publish to npm

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: 'The tag of the release to publish, such as 1.2.0 or 1.3.0-beta1'
                required: true
                type: string

permissions: {}

jobs:
    publish:
        name: Publish (${{ matrix.stack }})
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.repository == 'inertiaui/notifications'
        permissions:
            contents: read
            id-token: write
        strategy:
            fail-fast: false
            matrix:
                stack: [vue, react]
        env:
            TAG: ${{ github.event.release.tag_name || inputs.tag }}

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ env.TAG }}
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Check the version
              run: |
                  version=$(node -p "require('./package.json').version")

                  if [ "$version" != "$TAG" ]; then
                      echo "::error::The version in ${STACK}/package.json is ${version}, but the tag is ${TAG}."
                      exit 1
                  fi
              working-directory: ${{ matrix.stack }}
              env:
                  STACK: ${{ matrix.stack }}

            - name: Install pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  version: 11.5.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build:${{ matrix.stack }}

            # A tag with a hyphen, such as 1.3.0-beta1, is a prerelease, as in release.sh. It goes to the next dist-tag, so
            # installs keep getting the latest stable version, whether or not the GitHub release is marked as a prerelease.
            - name: Publish
              run: pnpm publish --access public --provenance --no-git-checks --tag "$DIST_TAG"
              working-directory: ${{ matrix.stack }}
              env:
                  DIST_TAG: ${{ contains(env.TAG, '-') && 'next' || 'latest' }}
